<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Radio Milenium — Canción del Día</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<!-- Firebase (base de datos gratuita para guardar las peticiones) -->
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
<style>

  :root{
    --navy:#1B1D3F;
    --navy-deep:#14163099;
    --blue-deep:#123C86;
    --blue-mid:#005FAF;
    --blue-bright:#0079BC;
    --gold:#FFCE09;
    --white:#F5F7FA;
    --dim:#8B93B8;
    --ok:#4FD1A5;
  }

  *{margin:0;padding:0;box-sizing:border-box;}

  html,body{
    background:var(--navy);
    color:var(--white);
    font-family:'Inter',sans-serif;
    min-height:100%;
  }

  .stage{ min-height:100vh; padding-bottom:60px; }

  /* ================= HERO ================= */
  .hero{
    position:relative;
    min-height:280px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:40px 20px 56px;
    overflow:hidden;
    background:
      radial-gradient(circle at 15% 20%, rgba(0,121,188,0.35), transparent 55%),
      radial-gradient(circle at 85% 80%, rgba(255,206,9,0.12), transparent 50%),
      var(--navy);
  }

  .hero-tag{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    letter-spacing:.3em;
    text-transform:uppercase;
    color:var(--gold);
    margin-bottom:10px;
    position:relative;
    z-index:1;
  }

  .hero-title{
    font-family:'Oswald',sans-serif;
    font-weight:700;
    text-transform:uppercase;
    font-size:clamp(40px,11vw,64px);
    letter-spacing:.02em;
    line-height:1;
    color:var(--white);
    position:relative;
    z-index:1;
  }
  .hero-title .accent{ color:var(--gold); }

  .hero-underline{
    width:70px;
    height:5px;
    background:var(--gold);
    margin:16px auto 14px;
    position:relative;
    z-index:1;
  }

  .hero-sub{
    font-size:14px;
    color:var(--dim);
    max-width:320px;
    position:relative;
    z-index:1;
  }

  /* geometric strip echoing the brand blocks */
  .geo-strip{
    display:flex;
    height:10px;
    width:100%;
  }
  .geo-strip span{ flex:1; }
  .geo-strip span:nth-child(1){ background:var(--blue-deep); }
  .geo-strip span:nth-child(2){ background:var(--blue-mid); }
  .geo-strip span:nth-child(3){ background:var(--gold); }
  .geo-strip span:nth-child(4){ background:var(--blue-bright); }
  .geo-strip span:nth-child(5){ background:var(--navy); }

  /* ================= WINNER BANNER ================= */
  .winner-wrap{
    display:none;
    max-width:480px;
    margin:32px auto 0;
    padding:0 20px;
  }
  .winner-wrap.show{ display:block; }

  .winner{
    background:var(--gold);
    color:var(--navy);
    border-radius:4px;
    padding:20px 22px 20px 78px;
    position:relative;
    box-shadow:0 18px 36px -14px rgba(0,0,0,0.55);
  }
  .winner-badge{
    position:absolute;
    left:-16px;
    top:50%;
    transform:translateY(-50%);
    width:64px;height:64px;
    border-radius:50%;
    overflow:hidden;
    border:3px solid var(--navy);
    background:var(--white);
    box-shadow:0 8px 16px rgba(0,0,0,0.3);
  }
  .winner-badge img{ width:100%; height:100%; object-fit:cover; }

  .winner-eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;
    letter-spacing:.2em;
    text-transform:uppercase;
    opacity:.75;
    margin-bottom:4px;
  }
  .winner-song{
    font-family:'Oswald',sans-serif;
    font-weight:700;
    text-transform:uppercase;
    font-size:21px;
    line-height:1.05;
  }
  .winner-artist{ font-size:13px; font-weight:600; margin-top:3px; }
  .winner-dedication{
    font-size:13px;
    font-style:italic;
    margin-top:8px;
    border-left:3px solid var(--navy);
    padding-left:8px;
  }

  /* ================= TICKET ================= */
  .ticket-outer{
    max-width:460px;
    margin:36px auto 0;
    padding:0 20px;
    position:relative;
  }

  .corner-blocks{
    position:absolute;
    top:-14px;
    left:6px;
    display:flex;
    gap:3px;
    z-index:2;
  }
  .corner-blocks span{ width:10px; height:22px; }
  .corner-blocks span:nth-child(1){ background:var(--blue-mid); }
  .corner-blocks span:nth-child(2){ background:var(--gold); height:30px; margin-top:-8px; }
  .corner-blocks span:nth-child(3){ background:var(--blue-bright); }

  .ticket{
    background:var(--white);
    color:var(--navy);
    border-radius:10px;
    padding:36px 26px 28px;
    box-shadow:0 30px 60px -25px rgba(0,0,0,0.6);
    position:relative;
  }

  .ticket-head{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    margin-bottom:2px;
  }
  .ticket-title{
    font-family:'Oswald',sans-serif;
    font-weight:600;
    text-transform:uppercase;
    font-size:20px;
    letter-spacing:.01em;
  }
  .ticket-folio{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    text-align:right;
    color:var(--dim);
    line-height:1.4;
  }
  .ticket-folio b{
    color:var(--blue-mid);
    font-size:16px;
    display:block;
  }

  label{
    display:block;
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--dim);
    margin-bottom:6px;
    margin-top:20px;
  }

  input, textarea{
    width:100%;
    border:none;
    border-bottom:2px solid #D8DCE8;
    background:transparent;
    font-family:'Inter',sans-serif;
    font-size:16px;
    color:var(--navy);
    padding:6px 2px 8px;
    outline:none;
    transition:border-color .2s;
  }
  input::placeholder, textarea::placeholder{ color:#AEB4CC; }
  input:focus, textarea:focus{ border-color:var(--blue-mid); }
  textarea{ resize:vertical; min-height:64px; font-size:14px; }

  .hint{ font-size:12px; color:var(--dim); margin-top:4px; }

  .divider{
    height:2px;
    margin:26px 0 4px;
    background:repeating-linear-gradient(to right, #D8DCE8 0 7px, transparent 7px 14px);
  }

  button.submit{
    width:100%;
    margin-top:22px;
    background:var(--navy);
    color:var(--gold);
    border:none;
    border-radius:6px;
    padding:15px;
    font-family:'Oswald',sans-serif;
    font-weight:600;
    text-transform:uppercase;
    font-size:16px;
    letter-spacing:.03em;
    cursor:pointer;
    transition:background .2s;
  }
  button.submit:hover{ background:var(--blue-mid); color:var(--white); }
  button.submit:active{ transform:scale(0.99); }
  button.submit:disabled{ opacity:.6; cursor:default; }

  .status-msg{
    text-align:center;
    margin-top:14px;
    font-size:13px;
    font-family:'IBM Plex Mono',monospace;
    min-height:16px;
  }
  .status-msg.ok{ color:var(--blue-mid); font-weight:600; }
  .status-msg.err{ color:#D64545; font-weight:600; }

  /* ================= FOOTER ================= */
  .footer{ text-align:center; margin-top:36px; }
  .stamp-link{
    display:inline-flex;
    align-items:center;
    gap:8px;
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:.18em;
    text-transform:uppercase;
    color:var(--dim);
    border:1px solid #333863;
    border-radius:20px;
    padding:8px 16px;
    cursor:pointer;
  }
  .stamp-link img{ width:18px; height:18px; border-radius:50%; }

  /* ================= ADMIN OVERLAY ================= */
  .admin-overlay{
    display:none;
    position:fixed; inset:0;
    background:rgba(12,13,32,0.96);
    z-index:50;
    overflow-y:auto;
    padding:30px 16px 60px;
  }
  .admin-overlay.show{ display:block; }
  .admin-box{ max-width:540px; margin:0 auto; }
  .admin-box h3{
    font-family:'Oswald',sans-serif;
    font-weight:700;
    text-transform:uppercase;
    font-size:26px;
    color:var(--white);
    margin-bottom:4px;
  }
  .admin-box .sub{
    color:var(--dim); font-size:12px; font-family:'IBM Plex Mono',monospace; margin-bottom:22px;
  }
  .close-admin{
    background:none; border:1px solid var(--dim); color:var(--white);
    padding:8px 14px; font-family:'IBM Plex Mono',monospace;
    font-size:12px; cursor:pointer; margin-bottom:20px; border-radius:6px;
  }

  .req-card{
    background:#22254A;
    border-left:4px solid var(--blue-mid);
    padding:16px 18px;
    margin-bottom:10px;
    border-radius:4px;
  }
  .req-card.picked{ border-left-color:var(--gold); }
  .req-top{ display:flex; justify-content:space-between; gap:10px; }
  .req-song{ font-weight:700; font-size:16px; color:var(--white); }
  .req-time{ font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--dim); white-space:nowrap; }
  .req-name{ color:var(--dim); font-size:12px; margin-top:6px; }
  .req-dedication{
    font-size:13px; font-style:italic; margin-top:8px; color:var(--white); opacity:.85;
    border-left:2px solid var(--gold); padding-left:8px;
  }
  .req-actions{ margin-top:12px; display:flex; gap:8px; }
  .req-actions button{
    font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.06em;
    padding:7px 12px; border:1px solid var(--dim); background:transparent; color:var(--white); cursor:pointer;
    border-radius:4px;
  }
  .req-actions button.pick{ border-color:var(--ok); color:var(--ok); }
  .req-actions button.unpick{ border-color:#D64545; color:#D64545; }

  .empty-state{ color:var(--dim); text-align:center; padding:30px 0; font-size:14px; }
</style>
</head>

<!-- ADMIN PANEL -->
<div class="admin-overlay" id="adminOverlay">
  <div class="admin-box">
    <button class="close-admin" id="closeAdmin">← Cerrar panel</button>
    <h3>Peticiones de hoy</h3>
    <div class="sub" id="todayLabel"></div>
    <div id="adminList"></div>
  </div>
</div>

<script>
/* =========================================================
   CONFIGURACIÓN — ajusta esto a tu gusto
   ========================================================= */
const REQUIRE_UNIVERSITY_EMAIL = false;
const UNIVERSITY_EMAIL_DOMAIN = "@univermilenium.edu";
const ADMIN_CODE = "CyTDRADIO"; // clave del panel del staff — cámbiala

// Your web app's Firebase configuration
const firebaseConfig = {
  apiKey: "AIzaSyDliukgwngUOiMyZrr_6EKTsVRrwq0knvI",
  authDomain: "radio-univer.firebaseapp.com",
  databaseURL: "https://radio-univer-default-rtdb.firebaseio.com",
  projectId: "radio-univer",
  storageBucket: "radio-univer.firebasestorage.app",
  messagingSenderId: "18123348327",
  appId: "1:18123348327:web:d9e6d9e3772f596a56f7c2"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

function todayStr(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}

if(REQUIRE_UNIVERSITY_EMAIL){
  document.getElementById("emailLabel").textContent = "Correo institucional *";
  document.getElementById("emailHint").textContent = `Debe terminar en ${UNIVERSITY_EMAIL_DOMAIN}`;
} else {
  document.getElementById("emailHint").textContent = "Opcional, solo para nosotros — no se muestra en pantalla.";
}

function reqsRef(){
  return db.ref(`requests/${todayStr()}`);
}
function pickRef(){
  return db.ref(`picks/${todayStr()}`);
}

async function refreshFolio(){
  try{
    const snap = await reqsRef().get();
    const count = snap.exists() ? Object.keys(snap.val()).length : 0;
    document.getElementById("folioNum").textContent = "N.° " + String(count + 1).padStart(3,"0");
  }catch(e){
    document.getElementById("folioNum").textContent = "N.° ···";
  }
}

async function loadTodayPick(){
  try{
    const snap = await pickRef().get();
    if(snap.exists()){
      const pick = snap.val();
      document.getElementById("winnerSong").textContent = pick.song;
      document.getElementById("winnerArtist").textContent = pick.artist ? `Pedida por ${pick.artist}` : "";
      const dedEl = document.getElementById("winnerDedication");
      if(pick.dedication){
        dedEl.textContent = `"${pick.dedication}"`;
        dedEl.style.display = "block";
      } else {
        dedEl.style.display = "none";
      }
      document.getElementById("winnerWrap").classList.add("show");
    }
  }catch(e){ /* aún no hay pick, o sin conexión */ }
}

document.getElementById("submitBtn").addEventListener("click", async () => {
  const song = document.getElementById("fSong").value.trim();
  const name = document.getElementById("fName").value.trim();
  const dedication = document.getElementById("fDedication").value.trim();
  const email = document.getElementById("fEmail").value.trim();
  const statusMsg = document.getElementById("statusMsg");
  const btn = document.getElementById("submitBtn");

  statusMsg.className = "status-msg";
  statusMsg.textContent = "";

  if(!song){
    statusMsg.textContent = "Escribe la canción y el artista.";
    statusMsg.classList.add("err");
    return;
  }
  if(REQUIRE_UNIVERSITY_EMAIL && !email.toLowerCase().endsWith(UNIVERSITY_EMAIL_DOMAIN.toLowerCase())){
    statusMsg.textContent = `Usa un correo que termine en ${UNIVERSITY_EMAIL_DOMAIN}`;
    statusMsg.classList.add("err");
    return;
  }

  btn.disabled = true;
  btn.textContent = "Enviando…";

  const entry = {
    ts: Date.now(),
    song, name: name || null, dedication: dedication || null, email: email || null
  };

  try{
    const newRef = reqsRef().push();
    await newRef.set(entry);
    statusMsg.textContent = "¡Va en la lista! 🦌🎟️";
    statusMsg.classList.add("ok");
    document.getElementById("fSong").value = "";
    document.getElementById("fName").value = "";
    document.getElementById("fDedication").value = "";
    document.getElementById("fEmail").value = "";
    await refreshFolio();
  }catch(e){
    console.error(e);
    statusMsg.textContent = "No se pudo enviar. Revisa tu conexión.";
    statusMsg.classList.add("err");
  }finally{
    btn.disabled = false;
    btn.textContent = "Meter mi canción";
  }
});

document.getElementById("adminLink").addEventListener("click", async () => {
  const code = prompt("Clave del panel del staff:");
  if(code !== ADMIN_CODE){
    if(code !== null) alert("Clave incorrecta.");
    return;
  }
  document.getElementById("adminOverlay").classList.add("show");
  document.getElementById("todayLabel").textContent = `Fecha: ${todayStr()}`;
  await renderAdminList();
});

document.getElementById("closeAdmin").addEventListener("click", () => {
  document.getElementById("adminOverlay").classList.remove("show");
});

async function renderAdminList(){
  const listEl = document.getElementById("adminList");
  listEl.innerHTML = "<div class='empty-state'>Cargando peticiones…</div>";

  let snap;
  try{
    snap = await reqsRef().get();
  }catch(e){
    listEl.innerHTML = "<div class='empty-state'>No se pudo conectar. Revisa tu configuración de Firebase.</div>";
    return;
  }

  if(!snap.exists()){
    listEl.innerHTML = "<div class='empty-state'>Aún no hay peticiones hoy.</div>";
    return;
  }

  const raw = snap.val();
  const entries = Object.entries(raw).map(([id, data]) => ({ id, ...data }));
  entries.sort((a,b) => b.ts - a.ts);

  let currentPickId = null;
  try{
    const pickSnap = await pickRef().get();
    if(pickSnap.exists()) currentPickId = pickSnap.val().id;
  }catch(e){}

  listEl.innerHTML = "";
  entries.forEach(entry => {
    const isPicked = entry.id === currentPickId;
    const card = document.createElement("div");
    card.className = "req-card" + (isPicked ? " picked" : "");
    const time = new Date(entry.ts).toLocaleTimeString("es-MX", {hour:"2-digit", minute:"2-digit"});
    card.innerHTML = `
      <div class="req-top">
        <div class="req-song">${escapeHtml(entry.song)}</div>
        <div class="req-time">${time}</div>
      </div>
      ${entry.name ? `<div class="req-name">Pedida por: ${escapeHtml(entry.name)}</div>` : ""}
      ${entry.email ? `<div class="req-name">${escapeHtml(entry.email)}</div>` : ""}
      ${entry.dedication ? `<div class="req-dedication">"${escapeHtml(entry.dedication)}"</div>` : ""}
      <div class="req-actions">
        ${isPicked
          ? `<button class="unpick" data-id="${entry.id}">Quitar de hoy</button>`
          : `<button class="pick" data-id="${entry.id}">Marcar como canción del día</button>`}
      </div>
    `;
    listEl.appendChild(card);
  });

  listEl.querySelectorAll("button.pick").forEach(btn => {
    btn.addEventListener("click", async () => {
      const id = btn.dataset.id;
      const entry = entries.find(e => e.id === id);
      await pickRef().set({
        id: entry.id, song: entry.song, artist: entry.name, dedication: entry.dedication
      });
      await renderAdminList();
      await loadTodayPick();
    });
  });

  listEl.querySelectorAll("button.unpick").forEach(btn => {
    btn.addEventListener("click", async () => {
      await pickRef().remove();
      await renderAdminList();
      document.getElementById("winnerWrap").classList.remove("show");
    });
  });
}

function escapeHtml(str){
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

loadTodayPick();
refreshFolio();
</script>

</body>
</html>
